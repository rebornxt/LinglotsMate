<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4FC5">
<title>TalkMate · AI language practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Thai:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --paper:#F7F6F1; --card:#FFFFFF; --ink:#1D2433; --mut:#646B78; --line:#E5E2D8; --line2:#D8D4C6;
  --blue:#2F4FC5; --blue-deep:#24398F; --blue-soft:#E9EDFB; --blue-line:#C3CEF3;
  --hl:#F4CE3F; --hl-soft:#FBF3D2; --hl-line:#E9D88F;
  --red:#C2344E; --red-soft:#FAE8EC;
  --green:#188A5E; --green-soft:#E1F3EA;
  --bub-user:#2F4FC5; --bub-user-ink:#FFFFFF;
  --shadow:0 10px 30px rgba(29,36,51,.10);
  --r:16px; --chat-fs:16px;
  --ui:'Hanken Grotesk','Noto Sans Thai','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
  --disp:'Bricolage Grotesque',var(--ui);
  --mono:'IBM Plex Mono','Noto Sans Thai','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari',ui-monospace,monospace;
  --serif:'Noto Serif','Noto Serif Thai','Noto Serif JP','Noto Serif KR','Noto Serif SC','Noto Serif Devanagari',Georgia,serif;
  --sans:var(--ui);
  --tl-font:var(--sans);
}
[data-theme="dark"]{
  --paper:#10131D; --card:#1A1F2D; --ink:#ECEEF6; --mut:#98A1B3; --line:#2A3146; --line2:#343C55;
  --blue:#8AA0F4; --blue-deep:#B9C6F8; --blue-soft:#222B49; --blue-line:#3A4878;
  --hl:#D9BC45; --hl-soft:#2E2A16; --hl-line:#56491C;
  --red:#EE7E94; --red-soft:#3A1F28;
  --green:#52C594; --green-soft:#16301F;
  --bub-user:#3D55C0; --bub-user-ink:#F2F4FF;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
/* ───────────────────────── base ───────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
::selection{background:var(--hl-soft)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hide{display:none!important}
.mono{font-family:var(--mono)}
.tl{font-family:var(--tl-font)}
/* eyebrow: ruby-annotation style tiny label */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
/* ───────────────────────── glyph badge (signature) ───────────────────────── */
.badge{width:42px;height:42px;border-radius:13px;background:var(--bub-user);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.badge .glyph{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1;display:block;transition:opacity .28s,transform .28s}
.badge .glyph.out{opacity:0;transform:translateY(6px)}
.badge.lg{width:76px;height:76px;border-radius:22px}
.badge.lg .glyph{font-size:40px}
@media (prefers-reduced-motion:reduce){.badge .glyph{transition:none}}
/* ───────────────────────── setup screen ───────────────────────── */
#setup{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px 60px}
.su-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:8px}
.su-title{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;margin-top:14px}
.su-tag{color:var(--mut);margin-bottom:18px;text-align:center}
.su-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.lab{display:block;font-weight:600;font-size:13.5px;margin:12px 2px 7px}
.lab:first-child{margin-top:0}
.inp{width:100%;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:15px}
.inp:focus{outline:none;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--mut);margin:6px 2px 0}
.hint.center{text-align:center;margin-top:14px}
details.az{margin-top:14px;border:1px dashed var(--line2);border-radius:12px;padding:10px 13px}
details.az summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
details.az summary::before{content:"+";font-family:var(--mono);font-weight:600;color:var(--blue)}
details.az[open] summary::before{content:"–"}
details.az .opt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue-deep);padding:2px 7px;border-radius:99px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line2);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--blue-line)}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep);font-weight:700}
.chip.sm{padding:5px 11px;font-size:13px}
/* buttons */
.btn{border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.prime{background:var(--bub-user);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.prime:hover{filter:brightness(1.07)}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:18px}
.btn.ghost{border:1.5px solid var(--line2);background:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
/* ───────────────────────── app shell ───────────────────────── */
#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:11px;padding:12px 14px 8px}
.ht{min-width:0;flex:1}
.hname{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.15}
.hsub{font-size:10.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hbtns{display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue-deep)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* tabs */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:13px;margin:4px 14px 10px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
/* ───────────────────────── chat ───────────────────────── */
.view{flex:1;overflow-y:auto;padding:6px 14px 16px;scroll-behavior:smooth}
#msgs{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.empty{margin:48px auto 0;text-align:center;color:var(--mut);max-width:300px;font-size:14px}
.row-m{display:flex;flex-direction:column;max-width:86%}
.row-m.user{align-self:flex-end;align-items:flex-end}
.row-m.ai{align-self:flex-start;align-items:flex-start}
.bub{padding:11px 15px;border-radius:18px;font-size:var(--chat-fs);line-height:1.65;word-break:break-word}
.row-m.user .bub{background:var(--bub-user);color:var(--bub-user-ink);border-bottom-right-radius:5px}
.row-m.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub ruby rt{font-size:.55em;color:var(--mut);font-family:var(--ui);letter-spacing:0}
.row-m.user .bub ruby rt{color:var(--bub-user-ink);opacity:.75}
/* teacher's note (highlighter card) */
.fixcard{background:var(--hl-soft);border:1px solid var(--hl-line);border-left:4px solid var(--hl);border-radius:13px;padding:9px 13px 10px;margin-bottom:7px;max-width:100%}
.fixcard .eyebrow{color:var(--ink);opacity:.65;display:block;margin-bottom:5px}
.fixline{font-size:calc(var(--chat-fs) - 2px);line-height:1.6;margin:3px 0}
.fixline del{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px;font-family:var(--tl-font)}
.fixline ins{color:var(--green);text-decoration:none;font-weight:700;font-family:var(--tl-font)}
.fixline .why{color:var(--mut);font-size:.9em}
.arr{color:var(--mut);padding:0 3px;font-family:var(--mono)}
/* translation box */
.transbox{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:8px 12px;font-size:calc(var(--chat-fs) - 2px);color:var(--blue-deep);margin-top:6px;line-height:1.6}
/* message actions */
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.act{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mut);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;display:inline-flex;align-items:center;gap:5px;transition:color .15s,border-color .15s}
.act:hover{color:var(--blue-deep);border-color:var(--blue-line)}
.act.on{color:var(--blue-deep);background:var(--blue-soft);border-color:var(--blue-line)}
.act.ld{color:var(--blue-deep);border-color:var(--blue-line);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.act.ld{animation:none;opacity:.6}}
/* typing indicator */
.typing{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;padding:4px 2px}
.typing .badge{width:30px;height:30px;border-radius:9px}
.typing .badge .glyph{font-size:15px}
.dots span{display:inline-block;width:4px;height:4px;border-radius:99px;background:var(--mut);margin-right:3px;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{30%{transform:translateY(-3px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
/* composer */
#composer{display:flex;align-items:flex-end;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
#inp{flex:1;background:var(--card);border:1.5px solid var(--line2);border-radius:16px;padding:11px 15px;resize:none;max-height:140px;font-size:var(--chat-fs);line-height:1.5;font-family:var(--tl-font)}
#inp:focus{outline:none;border-color:var(--blue)}
.send{width:46px;height:46px;flex:none;border-radius:14px;background:var(--bub-user);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:filter .15s,transform .08s}
.send:hover{filter:brightness(1.08)}
.send:active{transform:scale(.95)}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{opacity:.5}
/* ───────────────────────── grammar tab ───────────────────────── */
#vGrammar{padding-top:10px}
.gwrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ginp{width:100%;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;resize:vertical;min-height:84px;font-size:var(--chat-fs);line-height:1.6;margin:9px 0 11px}
.ginp:focus{outline:none;border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;border-radius:99px;padding:6px 14px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.gsec{margin-top:15px}
.corrected{font-size:calc(var(--chat-fs) + 2px);line-height:1.8;margin-top:7px}
.corrected mark{background:linear-gradient(transparent 58%,var(--hl-soft) 58%);color:var(--ink);padding:0 2px;box-shadow:inset 0 -2px 0 var(--hl)}
.fixrow{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line)}
.fixrow:last-child{border-bottom:0}
.altrow{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.altrow:last-child{border-bottom:0}
.altrow .txt{flex:1;font-size:var(--chat-fs);line-height:1.7}
.altrow .act{flex:none;margin-top:2px}
.gnote{font-size:13px;color:var(--mut);margin-top:13px;line-height:1.6}
/* ───────────────────────── sheets ───────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;inset:0;background:rgba(15,18,28,.45);backdrop-filter:blur(2px)}
.panel{position:relative;width:100%;max-width:600px;max-height:88dvh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
@media (min-width:720px){.sheet{align-items:center;padding:24px}.panel{border-radius:22px;max-height:84dvh}}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line2);margin:4px auto 12px}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ptitle h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em}
.prow{margin-top:16px}
.prow .lab{margin:0 2px 7px}
.seg3{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg3 button{flex:1;padding:8px 4px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mut);min-width:0}
.seg3 button.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
.subhint{font-size:12px;color:var(--mut);margin-top:6px;min-height:1.2em}
.range{width:100%;accent-color:var(--blue);margin-top:4px}
.rl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:2px}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0 4px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ════════ SETUP ════════ -->
<div id="setup" class="screen">
  <div class="su-wrap">
    <div class="badge lg"><span class="glyph gl">あ</span></div>
    <h1 class="su-title">TalkMate</h1>
    <p class="su-tag" data-i="tag"></p>
    <section class="su-card">
      <label class="lab" data-i="ul"></label>
      <div id="suUl" class="chips"></div>
      <label class="lab" data-i="tl"></label>
      <div id="suTl" class="chips"></div>
      <label class="lab" for="suKey" data-i="gemKey"></label>
      <input id="suKey" class="inp" type="password" placeholder="AIza..." autocomplete="off">
      <p class="hint"><span data-i="gemHint"></span> <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></p>
      <details class="az">
        <summary><span data-i="azTitle"></span> <span class="opt" data-i="optional"></span></summary>
        <label class="lab" for="suAzKey" data-i="azKey"></label>
        <input id="suAzKey" class="inp" type="password" autocomplete="off">
        <label class="lab" for="suAzReg" data-i="azRegion"></label>
        <input id="suAzReg" class="inp" type="text" placeholder="southeastasia">
        <p class="hint" data-i="azHint"></p>
      </details>
      <button id="suGo" class="btn prime big" data-i="start"></button>
      <p class="hint center" data-i="stIntro"></p>
    </section>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="app" class="screen hide">
  <header>
    <div class="badge"><span class="glyph gl">あ</span></div>
    <div class="ht">
      <div class="hname">TalkMate</div>
      <div id="hSub" class="hsub"></div>
    </div>
    <div class="hbtns">
      <button id="newB" class="iconbtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.3"/><path d="M3 4v5h5"/></svg></button>
      <button id="perB" class="iconbtn"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="15.5" cy="7" r="2.4"/><circle cx="7.5" cy="17" r="2.4"/></svg></button>
      <button id="setB" class="iconbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.5h4l.4-2.5a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2z"/></svg></button>
    </div>
  </header>
  <nav id="tabs" class="seg">
    <button data-tab="chat" class="on" data-i="tabChat"></button>
    <button data-tab="grammar" data-i="tabGrammar"></button>
  </nav>

  <main id="vChat" class="view"><div id="msgs"></div></main>

  <div id="composer">
    <textarea id="inp" class="tl" rows="1" enterkeyhint="send"></textarea>
    <button id="sendB" class="send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </div>

  <main id="vGrammar" class="view hide">
    <div class="gwrap">
      <div class="gcard">
        <span class="eyebrow" data-i="grTitle"></span>
        <textarea id="gInp" class="ginp tl"></textarea>
        <button id="gBtn" class="btn prime" data-i="grBtn"></button>
      </div>
      <div id="gOut"></div>
    </div>
  </main>
</div>

<!-- sheets are built by JS -->
<div id="shPer" class="sheet hide"><div class="back"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="shSet" class="sheet hide"><div class="back"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
/* ═══════════════════ data ═══════════════════ */
const GLYPHS=['あ','한','文','ก','अ','A','É','ß','Я','Ã','Ñ'];
const LANGS={
  en:{name:'English',  bcp:'en-US', vf:'en-US-JennyNeural',    vm:'en-US-GuyNeural'},
  th:{name:'ไทย',      bcp:'th-TH', vf:'th-TH-PremwadeeNeural',vm:'th-TH-NiwatNeural'},
  ja:{name:'日本語',    bcp:'ja-JP', vf:'ja-JP-NanamiNeural',   vm:'ja-JP-KeitaNeural', ruby:'furigana'},
  ko:{name:'한국어',    bcp:'ko-KR', vf:'ko-KR-SunHiNeural',    vm:'ko-KR-InJoonNeural'},
  zh:{name:'中文',      bcp:'zh-CN', vf:'zh-CN-XiaoxiaoNeural', vm:'zh-CN-YunxiNeural', ruby:'pinyin'},

/* ═══════════════════ state & storage (localStorage with in-memory fallback) ═══════════════════ */
const store=(()=>{let ok=true,mem={};try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){ok=false}
  return{get:k=>{try{return ok?localStorage.getItem(k):(mem[k]??null)}catch(e){return mem[k]??null}},
         set:(k,v)=>{mem[k]=v;if(ok){try{localStorage.setItem(k,v)}catch(e){}}}}})();
const DEF={geminiKey:'',azKey:'',azRegion:'',model:'gemini-3.1-flash-lite',ul:'th',tl:'en',theme:'light',font:'modern',fs:16,rate:1,done:false,
  p:{gender:'f',age:'peer',form:'chill',level:'mid',len:'mid',emoji:true,corr:'teacher',scen:'relax',custom:''}};
let S=(()=>{try{const r=store.get('tm.settings');if(r){const o=JSON.parse(r);return{...DEF,...o,p:{...DEF.p,...(o.p||{})}}}}catch(e){}return JSON.parse(JSON.stringify(DEF))})();
function save(){store.set('tm.settings',JSON.stringify(S))}
let M=[];try{M=JSON.parse(store.get('tm.chat')||'[]')||[]}catch(e){M=[]}
function saveChat(){store.set('tm.chat',JSON.stringify(M))}

/* ═══════════════════ helpers ═══════════════════ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function t(k){let s=(I18N[S.ul]&&I18N[S.ul][k])||I18N.en[k]||k;return s.replace('{tl}',LANGS[S.tl].name)}
function toast(msg){const x=$('#toast');x.textContent=msg;x.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>x.classList.remove('show'),3400)}
const X_SVG='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* signature: cycling multi-script glyph */
let glyphI=0,busyN=0;
function cycleGlyphs(){$$('.gl').forEach(g=>{g.classList.add('out');setTimeout(()=>{g.textContent=GLYPHS[glyphI];g.classList.remove('out')},180)});
  glyphI=(glyphI+1)%GLYPHS.length;clearTimeout(cycleGlyphs._t);cycleGlyphs._t=setTimeout(cycleGlyphs,busyN>0?320:2400)}
function busy(on){busyN+=on?1:-1;if(busyN<0)busyN=0;clearTimeout(cycleGlyphs._t);cycleGlyphs()}

/* ═══════════════════ appearance & i18n ═══════════════════ */
function applyLook(){document.documentElement.dataset.theme=S.theme;
  document.documentElement.style.setProperty('--chat-fs',S.fs+'px');
  document.documentElement.style.setProperty('--tl-font',S.font==='trad'?'var(--serif)':'var(--sans)')}
function scenLabel(){const map={relax:'scRelax',survival:'scSurvival',pro:'scPro',custom:'scCustom'};return LANGS[S.tl].name+' · '+t(map[S.p.scen]||'scRelax')}
function applyI18n(){$$('[data-i]').forEach(n=>{n.textContent=t(n.dataset.i)});
  $('#inp').placeholder=t('ph');$('#gInp').placeholder=t('grPh');$('#hSub').textContent=scenLabel();
  document.documentElement.lang=S.ul}

/* ═══════════════════ setup screen ═══════════════════ */
function chipRow(box,sel,onPick){box.innerHTML='';LORDER.forEach(c=>{const b=el('button','chip'+(c===sel?' on':''),LANGS[c].name);b.type='button';b.onclick=()=>onPick(c);box.appendChild(b)})}
function renderSetup(){chipRow($('#suUl'),S.ul,c=>{S.ul=c;save();renderSetup();applyI18n()});
  chipRow($('#suTl'),S.tl,c=>{S.tl=c;save();renderSetup();applyI18n()});
  $('#suKey').value=S.geminiKey;$('#suAzKey').value=S.azKey;$('#suAzReg').value=S.azRegion}
$('#suGo').onclick=()=>{const k=$('#suKey').value.trim();if(!k){toast(t('eKey'));return}
  S.geminiKey=k;S.azKey=$('#suAzKey').value.trim();S.azRegion=$('#suAzReg').value.trim();S.done=true;save();
  $('#setup').classList.add('hide');$('#app').classList.remove('hide');applyI18n();renderMsgs();startChat()};

/* ═══════════════════ tabs & sheets ═══════════════════ */
function switchTab(tab){$$('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
  $('#vChat').classList.toggle('hide',tab!=='chat');$('#composer').classList.toggle('hide',tab!=='chat');
  $('#vGrammar').classList.toggle('hide',tab!=='grammar')}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchTab(b.dataset.tab)});
function openSheet(sel){$(sel).classList.remove('hide')}
function closeSheet(sel){$(sel).classList.add('hide')}
$$('.sheet .back').forEach(b=>b.onclick=()=>b.parentElement.classList.add('hide'));
$('#perB').onclick=()=>{buildPersona();openSheet('#shPer')};
$('#setB').onclick=()=>{buildSettings();openSheet('#shSet')};
$('#newB').onclick=()=>{if(M.filter(m=>!m.hidden).length===0||confirm(t('confirmNew')))startChat()};

/* ═══════════════════ control builders ═══════════════════ */
function segRow(parent,labelKey,opts,get,set,hints){const row=el('div','prow');row.appendChild(el('label','lab',t(labelKey)));
  let hint=null;const sg=el('div','seg3');
  opts.forEach(o=>{const b=el('button',null,t(o.k)+(o.c?' · '+o.c:''));b.type='button';
    if(get()===o.v)b.classList.add('on');
    b.onclick=()=>{set(o.v);[...sg.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');if(hint&&hints)hint.textContent=t(hints[String(o.v)])};
    sg.appendChild(b)});
  row.appendChild(sg);
  if(hints){hint=el('div','subhint',t(hints[String(get())]));row.appendChild(hint)}
  parent.appendChild(row);return row}
function rangeRow(parent,labelKey,min,max,step,get,set,fmt){const row=el('div','prow');row.appendChild(el('label','lab',t(labelKey)));
  const r=el('input','range');r.type='range';r.min=min;r.max=max;r.step=step;r.value=get();
  const rl=el('div','rl');const cur=el('span','mono',fmt(get()));rl.appendChild(el('span',null,fmt(min)));rl.appendChild(cur);rl.appendChild(el('span',null,fmt(max)));
  r.oninput=()=>{set(+r.value);cur.textContent=fmt(+r.value)};
  row.appendChild(r);row.appendChild(rl);parent.appendChild(row)}
function sheetHead(panel,titleKey,closeSel){panel.innerHTML='';panel.appendChild(el('div','grab'));

/* ═══════════════════ Gemini API (with -preview fallback on 404) ═══════════════════ */
async function gemini(opts){if(!S.geminiKey){toast(t('eKey'));throw new Error('no-key')}
  const body={contents:opts.contents,generationConfig:{temperature:opts.temp??0.9,maxOutputTokens:2048,...(opts.json?{responseMimeType:'application/json'}:{})}};
  if(opts.system)body.systemInstruction={parts:[{text:opts.system}]};
  let model=S.model;
  for(let i=0;i<2;i++){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(S.geminiKey),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===404&&i===0){model=model.endsWith('-preview')?model.slice(0,-8):model+'-preview';continue}
    let d;try{d=await r.json()}catch(e){throw new Error('HTTP '+r.status)}
    if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
    if(model!==S.model){S.model=model;save()}
    const c=d.candidates&&d.candidates[0];const parts=(c&&c.content&&c.content.parts)||[];
    const txt=parts.map(x=>x.text||'').join('').trim();
    if(!txt)throw new Error('empty response');
    return txt}
  throw new Error('model not found')}

/* ═══════════════════ roleplay system prompt ═══════════════════ */
function buildSys(){const p=S.p,TL=ENAME[S.tl],UL=ENAME[S.ul];
  const scen=(p.scen==='custom'&&p.custom.trim())?('Custom scenario set by the user: '+p.custom.trim()):(SCEN[p.scen]||SCEN.relax);
  const FORM={street:'very casual, playful street/slang style that young native speakers actually use',chill:'friendly, relaxed everyday speech',neat:'polite, well-mannered, formal speech'}[p.form];
  const LVL={easy:'A1–A2 (simple common words, short basic sentences)',mid:'B1–B2 (everyday vocabulary, natural variety)',hard:'C1–C2 (rich vocabulary, idioms, complex structures)'}[p.level];
  const LEN={short:'very short — one brief sentence',mid:'short — 1 to 3 sentences',long:'fuller — 3 to 6 sentences with detail'}[p.len];
  const AGE={older:'noticeably older than',peer:'about the same age as',younger:'younger than'}[p.age];
  let corr;
  if(p.corr==='teacher'){corr='If the user\'s last message contains real language mistakes (grammar, word choice, spelling, clearly unnatural phrasing), START your output with exactly this block:\n<<FIX>>\n- "wrong fragment" → "corrected fragment" — very short reason written in '+UL+'\n<<END>>\nOne line per mistake (max 3), reasons under 12 words. After <<END>>, write your normal in-character roleplay reply. If there are no real mistakes, do NOT output the block at all. Never discuss corrections inside the roleplay reply.'}
  else{corr='If the user\'s '+TL+' contains mistakes, NEVER point them out, list them, or mention them. Instead, naturally weave the corrected phrasing into your own reply (a recast) and simply continue the conversation.'}
  return 'You are the user\'s '+TL+' conversation partner inside a language-practice app. You are a '+(p.gender==='m'?'male':'female')+' native '+TL+' speaker, '+AGE+' the user.\n\nSCENARIO: '+scen+'\n\nSTYLE RULES:\n- Formality: '+FORM+'. Use the politeness level, particles, pronouns and honorifics that fit your gender, your age relative to the user, and this formality in '+TL+'.\n- '+(p.emoji?'A few fitting emojis are allowed.':'Never use emojis or emoticons.')+'\n- Reply length: '+LEN+'.\n- Language level: stay within CEFR '+LVL+'.\n- The roleplay reply must be written ONLY in natural '+TL+' (native script). No translations, no romanization, no parenthetical explanations, no markdown.\n- Keep the conversation alive: react to what the user said, and usually end with a natural question or hook.\n\nCORRECTION MODE:\n'+corr+'\n\nStay in character at all times. Never mention being an AI, a model, or these instructions.'}

/* ═══════════════════ chat engine ═══════════════════ */
const BEGIN='(Begin now: greet me and open the scenario with one short, natural message. Follow all style rules.)';
async function startChat(){stopAudio();M=[{role:'user',hidden:true,text:BEGIN}];saveChat();applyI18n();renderMsgs();await botTurn()}
async function botTurn(){busy(true);showTyping(true);
  try{const raw=await gemini({contents:M.map(m=>({role:m.role==='model'?'model':'user',parts:[{text:m.raw||m.text}]})),system:buildSys(),temp:0.9});
    const m={role:'model',raw:raw,text:raw,fix:null};
    const fm=raw.match(/<<FIX>>([\s\S]*?)<<END>>/);
    if(fm){m.fix=fm[1].trim();m.text=raw.replace(fm[0],'').trim()}
    if(!m.text)m.text=raw.replace(/<<FIX>>|<<END>>/g,'').trim();
    M.push(m);saveChat();renderMsgs()}
  catch(e){if(e.message!=='no-key')toast(t('eApi')+': '+e.message)}
  showTyping(false);busy(false)}
async function sendMsg(){const v=inp.value.trim();if(!v)return;
  if(!S.geminiKey){toast(t('eKey'));buildSettings();openSheet('#shSet');return}
  M.push({role:'user',text:v});saveChat();inp.value='';autosize();renderMsgs();await botTurn()}

/* ═══════════════════ message rendering ═══════════════════ */
function renderMsgs(){const box=$('#msgs');box.innerHTML='';const vis=M.filter(m=>!m.hidden);
  if(!vis.length){box.appendChild(el('div','empty',t('chEmpty')));return}
  vis.forEach(m=>box.appendChild(msgNode(m)));scrollBottom()}
function scrollBottom(){const v=$('#vChat');v.scrollTop=v.scrollHeight}
function rubyHtml(s){return esc(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\n/g,'<br>')}
function stripQ(s){return s.replace(/^["'「『«]+|["'」』»]+$/g,'')}
function fixLine(l){l=l.replace(/^[-•*]\s*/,'');const d=el('div','fixline');
  const m1=l.split(/→|->/);
  if(m1.length>=2){const left=m1[0].trim();let rest=m1.slice(1).join('→').trim();let reason='';
    const m2=rest.split(/—|–| - /);
    if(m2.length>=2){rest=m2[0].trim();reason=m2.slice(1).join(' ').trim()}
    const de=document.createElement('del');de.textContent=stripQ(left);d.appendChild(de);
    d.appendChild(el('span','arr','→'));
    const ie=document.createElement('ins');ie.textContent=stripQ(rest);d.appendChild(ie);
    if(reason){d.appendChild(document.createTextNode(' '));d.appendChild(el('span','why','· '+reason))}}
  else d.textContent=l;
  return d}
function msgNode(m){const row=el('div','row-m '+(m.role==='user'?'user':'ai'));
  if(m.fix){const fc=el('div','fixcard');fc.appendChild(el('span','eyebrow',t('teacherNote')));
    m.fix.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>fc.appendChild(fixLine(l)));row.appendChild(fc)}
  const b=el('div','bub tl');
  if(m.showRuby&&m.ruby)b.innerHTML=rubyHtml(m.ruby);else b.innerHTML=esc(m.text).replace(/\n/g,'<br>');
  row.appendChild(b);
  if(m.showTr&&m.tr)row.appendChild(el('div','transbox',m.tr));
  if(m.role==='model'){const ac=el('div','acts');
    const lb=el('button','act','▶ '+t('aListen'));lb.onclick=()=>speak(m,lb);ac.appendChild(lb);
    const tb=el('button','act'+(m.showTr?' on':''),'⇄ '+t('aTrans'));tb.onclick=()=>doTrans(m,tb,row);ac.appendChild(tb);
    if(LANGS[S.tl].ruby){const rb=el('button','act'+(m.showRuby?' on':''),'^ '+t('aRuby'));rb.onclick=()=>doRuby(m,rb,row);ac.appendChild(rb)}
    row.appendChild(ac)}
  return row}
function showTyping(on){const ex=document.getElementById('typingNow');if(ex)ex.remove();if(!on)return;
  const d=el('div','typing');d.id='typingNow';
  const bd=el('div','badge');bd.appendChild(el('span','glyph gl',GLYPHS[glyphI]));d.appendChild(bd);
  const dt=el('span','dots');dt.innerHTML='<span></span><span></span><span></span>';d.appendChild(dt);
  d.appendChild(el('span',null,t('typing')));
  $('#msgs').appendChild(d);scrollBottom()}

/* ═══════════════════ in-chat helpers: translate & ruby ═══════════════════ */
async function doTrans(m,btn,row){if(m.tr){m.showTr=!m.showTr;saveChat();row.replaceWith(msgNode(m));return}
  btn.classList.add('ld');
  try{const out=await gemini({contents:[{role:'user',parts:[{text:'Translate this '+ENAME[S.tl]+' text into '+ENAME[S.ul]+'. Output ONLY the translation, nothing else.\n\n'+m.text}]}],temp:0.3});
    m.tr=out;m.showTr=true;saveChat();row.replaceWith(msgNode(m))}
  catch(e){if(e.message!=='no-key')toast(t('eApi'));btn.classList.remove('ld')}}
async function doRuby(m,btn,row){if(m.ruby){m.showRuby=!m.showRuby;saveChat();row.replaceWith(msgNode(m));return}
  btn.classList.add('ld');
  const ins=LANGS[S.tl].ruby==='furigana'
    ?'Rewrite the Japanese text, wrapping every word that contains kanji as {word|reading}, where reading is the hiragana furigana for that whole word. Leave kana, latin letters, numbers and punctuation untouched.'
    :'Rewrite the Chinese text, wrapping every Chinese word as {word|pinyin}, using pinyin with tone marks. Leave latin letters, numbers and punctuation untouched.';
  try{const out=await gemini({contents:[{role:'user',parts:[{text:ins+' Output ONLY the rewritten text, nothing else.\n\n'+m.text}]}],temp:0.2});
    m.ruby=out;m.showRuby=true;saveChat();row.replaceWith(msgNode(m))}
  catch(e){if(e.message!=='no-key')toast(t('eApi'));btn.classList.remove('ld')}}

/* ═══════════════════ TTS: Azure neural → Web Speech fallback ═══════════════════ */
let curAudio=null,curBtn=null;
function stopAudio(){if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  try{speechSynthesis.cancel()}catch(e){}
  if(curBtn){if(curBtn.dataset.idle)curBtn.textContent=curBtn.dataset.idle;curBtn.classList.remove('on');curBtn=null}}
function cleanTTS(s){return s.replace(/\{([^{}|]+)\|[^{}|]+\}/g,'$1').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu,'').trim()}
async function speak(m,btn){if(curBtn===btn){stopAudio();return}
  stopAudio();const text=cleanTTS(m.text);if(!text)return;
  btn.dataset.idle=btn.textContent;btn.textContent='■ '+t('aStop');btn.classList.add('on');curBtn=btn;
  const L=LANGS[S.tl];
  if(S.azKey&&S.azRegion){try{await azureSpeak(text,L);return}catch(e){}}
  webSpeak(text,L)}
async function azureSpeak(text,L){const pct=Math.round((S.rate-1)*100);
  const voice=S.p.gender==='m'?L.vm:L.vf;
  const ssml='<speak version="1.0" xml:lang="'+L.bcp+'"><voice name="'+voice+'"><prosody rate="'+(pct>=0?'+':'')+pct+'%">'+esc(text)+'</prosody></voice></speak>';
  const r=await fetch('https://'+S.azRegion+'.tts.speech.microsoft.com/cognitiveservices/v1',
    {method:'POST',headers:{'Ocp-Apim-Subscription-Key':S.azKey,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-24khz-48kbitrate-mono-mp3'},body:ssml});
  if(!r.ok)throw new Error('azure '+r.status);
  const blob=await r.blob();const url=URL.createObjectURL(blob);const a=new Audio(url);curAudio=a;
  a.onended=()=>{URL.revokeObjectURL(url);if(curAudio===a)stopAudio()};
  a.onerror=()=>{URL.revokeObjectURL(url);if(curAudio===a)stopAudio()};
  await a.play()}
function webSpeak(text,L){try{const u=new SpeechSynthesisUtterance(text);u.lang=L.bcp;u.rate=S.rate;
    const pick=()=>{const vs=speechSynthesis.getVoices();const pre=S.tl==='zh'?'zh':L.bcp.slice(0,2).toLowerCase();
      const v=vs.find(x=>x.lang&&x.lang.toLowerCase().replace('_','-').startsWith(pre));if(v)u.voice=v};
    pick();u.onend=()=>stopAudio();u.onerror=()=>stopAudio();speechSynthesis.speak(u)}
  catch(e){toast(t('eTts'));stopAudio()}}

/* ═══════════════════ grammar checker (structured JSON) ═══════════════════ */
$('#gBtn').onclick=checkGrammar;
async function checkGrammar(){const v=$('#gInp').value.trim();if(!v)return;
  if(!S.geminiKey){toast(t('eKey'));buildSettings();openSheet('#shSet');return}
  const btn=$('#gBtn');btn.disabled=true;btn.textContent=t('grWait');busy(true);
  const sys='You are a strict but friendly '+ENAME[S.tl]+' grammar checker for language learners. Analyze the sentence the user sends. Respond with ONLY one JSON object, no markdown fences, no commentary, exactly this shape:\n{"correct": true|false, "corrected": "the fully corrected sentence in '+ENAME[S.tl]+' (or the original if already correct)", "fixes": [{"from":"wrong fragment","to":"fixed fragment","reason":"short reason written in '+ENAME[S.ul]+'"}], "alternatives": ["1 to 3 natural ways a native '+ENAME[S.tl]+' speaker would express the same idea"], "note": "optional one-line tip in '+ENAME[S.ul]+', else empty string"}\nIf the sentence is correct, "fixes" must be an empty array. "alternatives" must always contain at least one item.';
  try{let out=await gemini({contents:[{role:'user',parts:[{text:v}]}],system:sys,temp:0.3,json:true});
    out=out.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const d=JSON.parse(out);renderG(d)}
  catch(e){if(e.message!=='no-key')toast(e instanceof SyntaxError?t('eJson'):(t('eApi')+(e.message?': '+e.message:'')))}
  btn.disabled=false;btn.textContent=t('grBtn');busy(false)}
function renderG(d){const o=$('#gOut');o.innerHTML='';const c=el('div','gcard');
  c.appendChild(el('span','pill '+(d.correct?'ok':'bad'),(d.correct?'✓ ':'✗ ')+t(d.correct?'okBadge':'badBadge')));
  if(!d.correct&&d.corrected){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('corrected')));
    const cs=el('div','corrected tl');const mk=document.createElement('mark');mk.textContent=d.corrected;cs.appendChild(mk);
    const lb=el('button','act','▶');lb.setAttribute('aria-label',t('aListen'));lb.style.marginLeft='8px';lb.onclick=()=>speak({text:d.corrected},lb);cs.appendChild(lb);
    s.appendChild(cs);c.appendChild(s)}
  if(Array.isArray(d.fixes)&&d.fixes.length){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('fixes')));
    d.fixes.forEach(f=>{const r=el('div','fixrow');const ln=el('div','fixline');
      const de=document.createElement('del');de.textContent=f.from||'';ln.appendChild(de);
      ln.appendChild(el('span','arr','→'));
      const ie=document.createElement('ins');ie.textContent=f.to||'';ln.appendChild(ie);r.appendChild(ln);
      if(f.reason)r.appendChild(el('div','subhint',f.reason));s.appendChild(r)});c.appendChild(s)}
  if(Array.isArray(d.alternatives)&&d.alternatives.length){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('alts')));
    d.alternatives.forEach(a=>{const r=el('div','altrow');r.appendChild(el('div','txt tl',a));
      const lb=el('button','act','▶');lb.setAttribute('aria-label',t('aListen'));lb.onclick=()=>speak({text:a},lb);r.appendChild(lb);s.appendChild(r)});c.appendChild(s)}
  if(d.note)c.appendChild(el('div','gnote','✎ '+d.note));
  o.appendChild(c)}

/* ═══════════════════ composer & init ═══════════════════ */
const inp=$('#inp');
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'}
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}});
$('#sendB').onclick=sendMsg;
(function init(){applyLook();cycleGlyphs();
  if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}}
  if(S.done&&S.geminiKey){$('#setup').classList.add('hide');$('#app').classList.remove('hide');applyI18n();renderMsgs();
    if(M.filter(m=>!m.hidden).length===0)startChat()}
  else{renderSetup();applyI18n()}})();
</script>
