<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#32487F">
<title>Linglots Mate · AI language practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Thai:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
/* tokens — Journal (Option B): paper, navy & brass */
:root{
  --paper:#FAF8F2; --card:#FFFFFF; --ink:#232733; --mut:#767D8C; --line:#E6E2D8; --line2:#D6D1C2;
  --blue:#32487F; --blue-deep:#27375F; --blue-soft:#E8EBF6; --blue-line:#C7D0EA;
  --hl:#B98A2A; --hl-soft:#F6EDD7; --hl-line:#E7D5A6;
  --red:#B3445A; --red-soft:#F4E0E4;
  --green:#2E7D5B; --green-soft:#DEF0E7;
  --bub-user:#32487F; --bub-user-ink:#F5F7FD;
  --shadow:0 12px 32px rgba(35,39,51,.08);
  --r:16px; --chat-fs:16px;
  --ui:'Karla','Noto Sans Thai','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
  --serif:'Literata','Noto Serif Thai','Noto Serif JP','Noto Serif KR','Noto Serif SC','Noto Serif Devanagari',Georgia,serif;
  --disp:var(--serif);
  --mono:'IBM Plex Mono','Noto Sans Thai','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari',ui-monospace,monospace;
  --sans:var(--ui);
  --tl-font:var(--serif);
}
[data-theme="dark"]{
  --paper:#12151F; --card:#1B202D; --ink:#EAEAE3; --mut:#9AA1B0; --line:#2A3042; --line2:#3A415A;
  --blue:#92A6E0; --blue-deep:#C0CDF2; --blue-soft:#232B47; --blue-line:#3C4875;
  --hl:#D3A945; --hl-soft:#2B2513; --hl-line:#55481E;
  --red:#E78EA2; --red-soft:#3A1F28;
  --green:#5CC494; --green-soft:#16301F;
  --bub-user:#3D55A8; --bub-user-ink:#EFF2FF;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}
::selection{background:var(--hl-soft)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hide{display:none!important}
.mono{font-family:var(--mono)}
.tl{font-family:var(--tl-font)}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
/* glyph badge — signature animation kept */
.badge{width:42px;height:42px;border-radius:14px;background:var(--bub-user);color:#fff;display:grid;place-items:center;flex:none}
.badge .glyph{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1;display:block;transition:opacity .28s,transform .28s}
.badge .glyph.out{opacity:0;transform:translateY(6px)}
.badge.lg{width:76px;height:76px;border-radius:24px}
.badge.lg .glyph{font-size:40px}
@media (prefers-reduced-motion:reduce){.badge .glyph{transition:none}}
/* setup */
#setup{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:44px 18px 64px}
.su-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:8px}
.su-title{font-family:var(--disp);font-style:italic;font-weight:600;font-size:34px;letter-spacing:-.01em;margin-top:14px}
.su-tag{color:var(--mut);margin-bottom:18px;text-align:center}
.su-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.lab{display:block;font-weight:700;font-size:13.5px;margin:12px 2px 7px}
.lab:first-child{margin-top:0}
.inp{width:100%;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:15px}
.inp:focus{outline:none;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--mut);margin:6px 2px 0}
.hint.center{text-align:center;margin-top:14px}
details.az{margin-top:14px;border:1px dashed var(--line2);border-radius:12px;padding:10px 13px}
details.az summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
details.az summary::-webkit-details-marker{display:none}
details.az summary::before{content:"+";font-family:var(--mono);font-weight:600;color:var(--blue)}
details.az[open] summary::before{content:"\2013"}
details.az .opt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue-deep);padding:2px 7px;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line2);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--blue-line)}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep);font-weight:700}
.chip.sm{padding:5px 11px;font-size:13px}
.btn{border-radius:99px;padding:11px 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.prime{background:var(--bub-user);color:#fff}
.btn.prime:hover{filter:brightness(1.1)}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:18px}
.btn.ghost{border:1.5px solid var(--line2);background:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
/* app shell */
#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;width:100%;position:relative}
#side{position:relative;flex:none}
#side header{display:flex;align-items:center;gap:11px;padding:12px 14px 8px;padding-inline-end:142px}
.ht{min-width:0;flex:1}
.hname{font-family:var(--disp);font-style:italic;font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.15}
.hsub{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.hbtns{display:flex;gap:2px}
.sideactions{position:absolute;top:13px;inset-inline-end:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue-deep)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ibl{display:none}
#maincol{flex:1;min-height:0;display:flex;flex-direction:column}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:99px;margin:4px 14px 10px}
.seg button{flex:1;padding:8px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
/* chat */
.view{flex:1;overflow-y:auto;padding:6px 14px 16px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.view{scroll-behavior:auto}}
#msgs{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.empty{margin:48px auto 0;text-align:center;color:var(--mut);max-width:300px;font-size:14px}
.row-m{display:flex;flex-direction:column;max-width:86%}
.row-m.user{align-self:flex-end;align-items:flex-end}
.row-m.ai{align-self:flex-start;align-items:flex-start}
.bub{padding:12px 17px;border-radius:16px;font-size:var(--chat-fs);line-height:1.7;word-break:break-word}
.row-m.user .bub{background:var(--bub-user);color:var(--bub-user-ink);border-bottom-right-radius:5px}
.row-m.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(35,39,51,.04)}
.bub ruby rt{font-size:.55em;color:var(--mut);font-family:var(--ui);letter-spacing:0}
.row-m.user .bub ruby rt{color:var(--bub-user-ink);opacity:.75}
.fixcard{background:var(--hl-soft);border:1px solid var(--hl-line);border-left:4px solid var(--hl);border-radius:12px;padding:10px 14px 11px;margin-bottom:8px;max-width:100%}
[dir="rtl"] .fixcard{border-left:1px solid var(--hl-line);border-right:4px solid var(--hl)}
.fixcard .eyebrow{color:var(--ink);opacity:.65;display:block;margin-bottom:5px}
.fixline{font-size:calc(var(--chat-fs) - 2px);line-height:1.6;margin:3px 0}
.fixline del{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px;font-family:var(--tl-font)}
.fixline ins{color:var(--green);text-decoration:none;font-weight:700;font-family:var(--tl-font)}
.fixline .why{color:var(--mut);font-size:.9em}
.arr{color:var(--mut);padding:0 3px;font-family:var(--mono)}
.hintcard{position:relative;background:linear-gradient(180deg,var(--hl-soft),var(--card));border:1px solid var(--hl-line);border-radius:15px;padding:0;margin-top:8px;max-width:100%;overflow:hidden;box-shadow:0 4px 14px -8px var(--hl)}
.hintcard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--hl),var(--blue))}
.hint-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 6px 16px}
.hint-ttl{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-style:italic;font-weight:600;font-size:15px;color:var(--ink)}
.hint-ic{font-style:normal;font-size:16px;filter:saturate(1.1)}
.hint-body{padding:2px 14px 8px 16px}
.hintline{display:flex;gap:9px;align-items:flex-start;font-size:calc(var(--chat-fs) - 1px);line-height:1.6;margin:5px 0}
.hintline.frame{background:var(--card);border:1px dashed var(--hl-line);border-radius:9px;padding:7px 10px;margin:6px 0;font-weight:600}
.hintbul{flex:none;font-size:.95em;margin-top:1px;opacity:.85}
.hinttx{flex:1}
.hint-sep{display:flex;align-items:center;gap:9px;margin:4px 16px 2px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hint-sep::before,.hint-sep::after{content:"";flex:1;height:1px;background:var(--hl-line);opacity:.6}
.hint-more{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 24px);margin:4px 12px 12px;padding:8px;border:1.5px dashed var(--hl-line);border-radius:10px;background:transparent;color:var(--hl);font-weight:700;font-size:12.5px;transition:background .15s,border-color .15s}
.hint-more:hover{background:var(--hl-soft);border-color:var(--hl)}
.hint-more span{font-size:15px;line-height:1}
.hint-more.ld{opacity:.6}
.hint-more:disabled{cursor:default}
.transbox{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:8px 12px;font-size:calc(var(--chat-fs) - 2px);color:var(--blue-deep);margin-top:6px;line-height:1.6}
.acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.act{font-family:var(--ui);font-size:11.5px;font-weight:700;color:var(--mut);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:color .15s,border-color .15s}
.act:hover{color:var(--blue-deep);border-color:var(--blue-line)}
.act.on{color:var(--blue-deep);background:var(--blue-soft);border-color:var(--blue-line)}
.act.ld{color:var(--blue-deep);border-color:var(--blue-line);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.act.ld{animation:none;opacity:.6}}
.typing{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;padding:4px 2px}
.typing .badge{width:30px;height:30px;border-radius:10px}
.typing .badge .glyph{font-size:15px}
.dots span{display:inline-block;width:4px;height:4px;border-radius:99px;background:var(--mut);margin-right:3px;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{30%{transform:translateY(-3px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
#composer{display:flex;align-items:flex-end;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));width:100%;border-top:1px solid var(--line);background:var(--paper)}
#inp{flex:1;background:var(--card);border:1.5px solid var(--line2);border-radius:24px;padding:12px 19px;resize:none;max-height:140px;font-size:var(--chat-fs);line-height:1.5;font-family:var(--tl-font)}
#inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.send{width:48px;height:48px;flex:none;border-radius:99px;background:var(--bub-user);color:#fff;display:grid;place-items:center;transition:filter .15s,transform .08s}
.send{box-shadow:0 4px 14px -4px var(--blue)}
.send:hover{filter:brightness(1.1)}
.send:active{transform:scale(.95)}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{opacity:.5}
/* grammar */
#vGrammar{padding-top:10px}
.gwrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.ginp{width:100%;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;resize:vertical;min-height:84px;font-size:var(--chat-fs);line-height:1.6;margin:9px 0 11px}
.ginp:focus{outline:none;border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;border-radius:99px;padding:6px 14px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.gsec{margin-top:15px}
.corrected{font-size:calc(var(--chat-fs) + 2px);line-height:1.8;margin-top:7px}
.corrected mark{background:linear-gradient(transparent 58%,var(--hl-soft) 58%);color:var(--ink);padding:0 2px;box-shadow:inset 0 -2px 0 var(--hl)}
.fixrow{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line)}
.fixrow:last-child{border-bottom:0}
.altrow{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.altrow:last-child{border-bottom:0}
.altrow .txt{flex:1;font-size:var(--chat-fs);line-height:1.7}
.altrow .act{flex:none;margin-top:2px}
.gnote{font-size:13px;color:var(--mut);margin-top:13px;line-height:1.6;font-style:italic}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;inset:0;background:rgba(21,24,35,.45);backdrop-filter:blur(2px)}
.panel{position:relative;width:100%;max-width:600px;max-height:88dvh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
@media (min-width:720px){.sheet{align-items:center;padding:24px}.panel{border-radius:22px;max-height:84dvh}}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line2);margin:4px auto 12px}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ptitle h2{font-family:var(--disp);font-style:italic;font-weight:600;font-size:20px;letter-spacing:-.01em}
.prow{margin-top:16px}
.prow .lab{margin:0 2px 7px}
.seg3{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg3 button{flex:1;padding:8px 4px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut);min-width:0}
.seg3 button.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
.subhint{font-size:12px;color:var(--mut);margin-top:6px;min-height:1.2em}
.range{width:100%;accent-color:var(--blue);margin-top:4px}
.rl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:2px}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0 4px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rawbar{margin:0 14px 8px;background:var(--red-soft);color:var(--red);border:1px dashed var(--red);border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:600;text-align:center}
.subhint.warn{color:var(--red);font-weight:600}
.vgrp{display:block;margin:10px 2px 6px}
/* language picker — scannable card grid */
.gtrans{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.gtrans .eyebrow{display:block;margin-bottom:3px}
.gtrans-tx{font-size:calc(var(--chat-fs) - 1px);color:var(--mut);line-height:1.55}
.lpick{display:flex;flex-direction:column}
.lsrch-wrap{position:sticky;top:0;z-index:5;background:var(--paper);padding:2px 0 10px;box-shadow:0 -16px 0 var(--paper)}
.lpick .lsrch{margin:0;padding-left:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23767D8C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");background-repeat:no-repeat;background-position:13px 50%;background-size:17px}
.lp-h{display:flex;align-items:center;gap:10px;margin:18px 2px 9px;font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.lp-h::after{content:"";flex:1;height:1px;background:var(--line);order:3}
.lp-h-n{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
.lp-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1.5px solid var(--line2);background:var(--card);border-radius:13px;text-align:start;transition:border-color .15s,background .15s,box-shadow .15s}
.lp-item:hover{border-color:var(--blue-line)}
.lp-item.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.lp-flag{font-size:21px;line-height:1;flex:none;width:26px;text-align:center}
.lp-tx{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.lp-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-item.on .lp-name{color:var(--blue-deep);font-weight:700}
.lp-en{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lp-ck{flex:none;width:18px;height:18px;display:grid;place-items:center;color:var(--blue);opacity:0;transition:opacity .15s}
.lp-item.on .lp-ck{opacity:1}
.lp-ck svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lp-empty{color:var(--mut);font-size:14px;padding:18px 2px;text-align:center}
/* confirm dialog */
.cf-sheet{align-items:center;padding:24px;z-index:80}
.cdialog{position:relative;width:100%;max-width:384px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:0 26px 64px rgba(0,0,0,.28);animation:cdin .22s ease;text-align:center}
@keyframes cdin{from{transform:scale(.94) translateY(10px)}}
@media (prefers-reduced-motion:reduce){.cdialog{animation:none}}
.cd-ic{width:54px;height:54px;border-radius:17px;background:var(--hl-soft);color:var(--hl);display:grid;place-items:center;margin:0 auto 15px}
.cd-ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cd-title{font-family:var(--disp);font-style:italic;font-weight:600;font-size:22px;letter-spacing:-.01em;margin-bottom:8px}
.cd-body{font-size:14px;color:var(--mut);line-height:1.65;margin-bottom:22px;max-width:300px;margin-left:auto;margin-right:auto}
.cd-acts{display:flex;gap:10px}
.cd-acts .btn{flex:1;padding:12px}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(1.07)}
.settabs{margin:10px 0 4px;overflow-x:auto;scrollbar-width:none;border-radius:12px}
.settabs::-webkit-scrollbar{display:none}
.settabs button{font-size:12.5px;padding:8px 11px;white-space:nowrap;flex:1 0 auto;transition:color .15s,background .15s}
.settabs button.on{box-shadow:inset 0 0 0 1px var(--blue-line)}
/* desktop — journal sidebar layout */
@media (min-width:980px){
  #app{flex-direction:row;max-width:1340px}
  #side{width:300px;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);padding:28px 18px 18px}
  [dir="rtl"] #side{border-right:0;border-left:1px solid var(--line)}
  #side header{flex-direction:column;align-items:flex-start;gap:12px;padding:0 6px}
  .hname{font-size:22px;white-space:nowrap}
  .hsub{white-space:normal;margin-top:4px;line-height:1.5}
  #tabs.seg{flex-direction:column;background:none;border:0;padding:0;margin:22px 0 0;gap:6px}
  #tabs.seg button{text-align:start;padding:11px 15px;border-radius:12px;font-size:15px;flex:none}
  .sideactions{position:static;margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
  .sideactions .iconbtn{width:100%;height:auto;display:flex;align-items:center;justify-content:flex-start;gap:11px;padding:10px 13px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.3;text-align:start}
  .ibl{display:inline}
  #maincol{background:var(--paper)}
  .view{padding:22px 40px 22px}
  #composer{padding:12px 40px calc(20px + env(safe-area-inset-bottom))}
  .rawbar{margin:12px 40px 0}
  #msgs{max-width:720px}
  .gwrap{max-width:720px}
}

function t(k){const d=I18N[S.ul]||DYN[S.ul];let s=(d&&d[k])||I18N.en[k]||k;return s.replace('{tl}',LANGS[S.tl].name)}
async function loadDynUL(code){if(I18N[code]||DYN[code])return;const ck='tm.i18n.'+code;
  try{const c=store.get(ck);if(c){DYN[code]=JSON.parse(c);applyI18n();return}}catch(e){}
  if(!S.geminiKey)return;
  toast(t('uiTrans'));
  try{let out=await gemini({contents:[{role:'user',parts:[{text:JSON.stringify(I18N.en)}]}],
    system:'Translate every value of this JSON object of app UI strings into '+ENAME[code]+'. Keep all keys unchanged. Keep the placeholder {tl} exactly as-is wherever it appears. Keep brand and technical names (Gemini, Azure, ElevenLabs, API, CEFR, Voice Library, key) untranslated. Respond with ONLY the JSON object, no markdown.',
    temp:0.2,json:true,maxTok:8192});
    out=out.replace(/^\u0060\u0060\u0060json\s*/i,'').replace(/\u0060\u0060\u0060\s*$/,'').trim();
    const d=JSON.parse(out);
    if(d&&typeof d==='object'){DYN[code]=d;store.set(ck,JSON.stringify(d));
      if(S.ul===code){applyI18n();if(!$('#shSet').classList.contains('hide'))buildSettings();if(!$('#setup').classList.contains('hide'))renderSetup()}}}
  catch(e){toast(t('eApi'))}}

/* signature: cycling multi-script glyph */
let glyphI=0,busyN=0;
function cycleGlyphs(){$$('.gl').forEach(g=>{g.classList.add('out');setTimeout(()=>{g.textContent=GLYPHS[glyphI];g.classList.remove('out')},180)});
  glyphI=(glyphI+1)%GLYPHS.length;clearTimeout(cycleGlyphs._t);cycleGlyphs._t=setTimeout(cycleGlyphs,busyN>0?320:2400)}
function busy(on){busyN+=on?1:-1;if(busyN<0)busyN=0;clearTimeout(cycleGlyphs._t);cycleGlyphs()}

const CANCEL={en:'Cancel',th:'ยกเลิก',ja:'キャンセル',ko:'취소',zh:'取消',hi:'रद्द करें',es:'Cancelar',fr:'Annuler',de:'Abbrechen',pt:'Cancelar',ru:'Отмена'};
const IC_RESET='<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.3"/><path d="M3 4v5h5"/></svg>';
function uiConfirm(o){return new Promise(res=>{
  const sh=el('div','sheet cf-sheet');const bk=el('div','back');sh.appendChild(bk);
  const d=el('div','cdialog');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');

  ac.appendChild(cancel);ac.appendChild(ok);d.appendChild(ac);sh.appendChild(d);document.body.appendChild(sh);
  let done=false;const close=v=>{if(done)return;done=true;document.removeEventListener('keydown',onKey);sh.remove();res(v)};
  function onKey(e){if(e.key==='Escape')close(false);else if(e.key==='Enter')close(true)}
  bk.onclick=()=>close(false);cancel.onclick=()=>close(false);ok.onclick=()=>close(true);

/* ═══════════════════ Gemini API (with -preview fallback on 404) ═══════════════════ */
async function gemini(opts){if(!S.geminiKey){toast(t('eKey'));throw new Error('no-key')}
  const body={contents:opts.contents,generationConfig:{temperature:opts.temp??0.9,maxOutputTokens:opts.maxTok||2048,...(opts.json?{responseMimeType:'application/json'}:{})}};
  if(opts.system)body.systemInstruction={parts:[{text:opts.system}]};
  let model=S.model;
  for(let i=0;i<2;i++){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(S.geminiKey),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===404&&i===0){model=model.endsWith('-preview')?model.slice(0,-8):model+'-preview';continue}
    let d;try{d=await r.json()}catch(e){throw new Error('HTTP '+r.status)}
    if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
    if(model!==S.model){S.model=model;save()}
    const c=d.candidates&&d.candidates[0];const parts=(c&&c.content&&c.content.parts)||[];
    const txt=parts.map(x=>x.text||'').join('').trim();
    if(!txt)throw new Error('empty response');

  throw new Error('model not found')}

/* ═══════════════════ roleplay system prompt ═══════════════════ */
function buildSys(){const p=S.p,TL=ENAME[S.tl],UL=ENAME[S.ul];
  const scen=((p.scen==='custom'&&p.custom.trim())?('Custom scenario set by the user: '+p.custom.trim()):(SCEN[p.scen]||SCEN.relax)).split('__TL__').join(TL);
  const FORM={street:'very casual, playful street/slang style that young native speakers actually use',chill:'friendly, relaxed everyday speech',neat:'polite, well-mannered, formal speech',raw:'extremely casual and crude, the way close friends banter in movies, anime and real life: frequent natural swearing, vulgar slang, blunt teasing and rough interjections are expected and authentic. This is for receptive learning of real-world speech. Never use slurs or hateful language about groups of people — only everyday profanity between friends'}[p.form];
  const LVL={easy:'A1–A2 — simple, common, high-frequency words and basic grammar',mid:'B1–B2 — everyday vocabulary and a natural mix of structures',hard:'C1–C2 — rich vocabulary, idioms, nuanced and complex grammar'}[p.level];
  const LEN={short:'very short — one brief sentence',mid:'short — 1 to 3 sentences',long:'fuller — 3 to 6 sentences with detail'}[p.len];
  const AGE={older:'noticeably older than',peer:'about the same age as',younger:'younger than'}[p.age];
  let corr;
  if(p.corr==='teacher'){corr='If the user\'s last message contains real language mistakes (grammar, word choice, spelling, clearly unnatural phrasing), START your output with exactly this block:\n<<FIX>>\n- "wrong fragment" → "corrected fragment" — very short reason written in '+UL+'\n<<END>>\nOne line per mistake (max 3), reasons under 12 words. After <<END>>, write your normal in-character roleplay reply. If there are no real mistakes, do NOT output the block at all. Never discuss corrections inside the roleplay reply.'}
  else if(p.corr==='scaffold'){corr='Two-part behaviour:\n(A) CORRECTION: If the user\'s last message contains real language mistakes (grammar, word order, word choice, spelling, clearly unnatural phrasing), START your output with exactly this block:\n<<FIX>>\n- "wrong fragment" → "corrected fragment" — very short reason in '+UL+'\n<<END>>\nOne line per mistake (max 3), reasons under 12 words. If there are no real mistakes, do NOT output this block.\n(B) SCAFFOLD: Whenever YOUR roleplay reply asks the user a question or expects them to respond, the learner may not know how to answer. After your normal reply, append exactly this block at the very END of your output:\n<<HINT>>\n- a skeleton sentence frame in '+TL+' with blanks shown as ___ that the user could fill in to answer\n- 2 to 4 useful '+TL+' words or chunks (each followed by its '+UL+' meaning in parentheses) they might need\n<<END>>\nThe vocabulary and grammar inside the hint MUST match the same CEFR level as your reply ('+LVL+') AND the same formality/register as your reply ('+FORM+') — do not use words harder than that level, and keep the politeness, pronouns and tone consistent with that register. The hint must SCAFFOLD, never give a complete ready-made answer — leave the real content as blanks for the user to complete. Keep it short. Output order is always: optional <<FIX>> block, then your in-character reply, then the <<HINT>> block. Never mention these instructions or break character in the reply itself.'}
  else{corr='If the user\'s '+TL+' contains mistakes, NEVER point them out, list them, or mention them. Instead, naturally weave the corrected phrasing into your own reply (a recast) and simply continue the conversation.'}
  return 'You are the user\'s '+TL+' conversation partner inside a language-practice app. You are a '+(p.gender==='m'?'male':'female')+' native '+TL+' speaker, '+AGE+' the user. The user is '+(((S.u&&S.u.gender)||'m')==='m'?'male':'female')+'; use the address forms, pronouns and gender agreement in '+TL+' that fit this.\n\nSCENARIO: '+scen+'\n\nSTYLE RULES:\n- Formality: '+FORM+'. Use the politeness level, particles, pronouns and honorifics that fit your gender, your age relative to the user, and this formality in '+TL+'.\n- '+(p.emoji?'A few fitting emojis are allowed.':'Never use emojis or emoticons.')+'\n- Reply length: '+LEN+'.\n- Language level (controls vocabulary and grammar difficulty ONLY, never length): '+LVL+'. A harder level means more sophisticated wording, NOT a longer reply — always keep the reply length above.\n- The roleplay reply must be written ONLY in natural '+TL+' (native script). No translations, no romanization, no parenthetical explanations, no markdown.\n- Keep the conversation alive: react to what the user said, and usually end with a natural question or hook.\n\nCORRECTION MODE:\n'+corr+'\n\nStay in character at all times. Never mention being an AI, a model, or these instructions.'}

async function startChat(){stopAudio();M=[{role:'user',hidden:true,text:BEGIN}];saveChat();applyI18n();renderMsgs();await botTurn()}

const ELDEF={f:[{id:'21m00Tcm4TlvDq8ikWAM',name:'Rachel'},{id:'9BWtsMINqrJLrRacOk9x',name:'Aria'}],m:[{id:'pNInz6obpgDQGcFmaJgB',name:'Adam'},{id:'nPczCjzI2devNBz1zQrb',name:'Brian'}]};

async function loadElVoices(){if(ELV)return ELV;if(!S.elKey)throw new Error('no key');

    const lb=el('button','act','▶');lb.setAttribute('aria-label',t('aListen'));lb.style.marginLeft='8px';lb.onclick=()=>speak({text:d.corrected},lb);cs.appendChild(lb);
    s.appendChild(cs);
    if(d.translation){const tr=el('div','gtrans');tr.appendChild(el('span','eyebrow',t('aTrans')));tr.appendChild(el('div','gtrans-tx',d.translation));s.appendChild(tr)}
    c.appendChild(s)}
  else if(d.translation){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('aTrans')));s.appendChild(el('div','gtrans-tx',d.translation));c.appendChild(s)}
  if(Array.isArray(d.fixes)&&d.fixes.length){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('fixes')));
    d.fixes.forEach(f=>{const r=el('div','fixrow');const ln=el('div','fixline');
      const de=document.createElement('del');de.textContent=f.from||'';ln.appendChild(de);
      ln.appendChild(el('span','arr','→'));
      const ie=document.createElement('ins');ie.textContent=f.to||'';ln.appendChild(ie);r.appendChild(ln);
      if(f.reason)r.appendChild(el('div','subhint',f.reason));s.appendChild(r)});c.appendChild(s)}
  if(Array.isArray(d.alternatives)&&d.alternatives.length){const s=el('div','gsec');s.appendChild(el('span','eyebrow',t('alts')));
    d.alternatives.forEach(a=>{const r=el('div','altrow');r.appendChild(el('div','txt tl',a));
      const lb=el('button','act','▶');lb.setAttribute('aria-label',t('aListen'));lb.onclick=()=>speak({text:a},lb);r.appendChild(lb);s.appendChild(r)});c.appendChild(s)}
  if(d.note)c.appendChild(el('div','gnote','✎ '+d.note));
  o.appendChild(c)}

/* ═══════════════════ composer & init ═══════════════════ */
const inp=$('#inp');
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'}
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}});
inp.addEventListener('focus',()=>setTimeout(scrollBottom,300));
window.addEventListener('resize',()=>{if(!$('#vChat').classList.contains('hide'))requestAnimationFrame(scrollBottom)});
$('#sendB').onclick=sendMsg;
(function init(){applyLook();cycleGlyphs();if(!I18N[S.ul])loadDynUL(S.ul);
  if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}}
  if(S.done&&S.geminiKey){$('#setup').classList.add('hide');$('#app').classList.remove('hide');applyI18n();renderMsgs();
    if(M.filter(m=>!m.hidden).length===0)startChat()}
  else{renderSetup();applyI18n()}})();
</script>
